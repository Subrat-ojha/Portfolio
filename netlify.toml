[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 on Netlify. The OpenNext adapter is installed and kept current by
  # Netlify automatically, so we deliberately don't pin it here.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
